<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoodBridge</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <a href="newhome.html">
        <img src="image/imglogo.png" alt="FoodBridge Logo"/>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="newhome.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Login to FoodBridge</h2>
    
    <input type="radio" id="tab-login" name="tab" checked>
    <input type="radio" id="tab-signup" name="tab">
    
    <div class="tabs">
      <label for="tab-login">Login</label>
      <label for="tab-signup">User Type</label>
    </div>
    
    <div class="forms">
      <div id="login" class="form">
        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">
          Test credentials:<br>
          Donor: donor@test.com / donor123<br>
          NGO: ngo@test.com / ngo123
        </p>
      </div>
      
      <div id="signup" class="form">
        <p>Choose your account type:</p>
        <button onclick="window.location.href='donor-portal.html'" style="margin: 5px 0;">Food Donor</button>
        <button onclick="window.location.href='ngo-portal.html'" style="margin: 5px 0;">NGO Registration</button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
